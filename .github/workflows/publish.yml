name: Publish

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build package distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Hatch-vcs needs full history to derive versions from tags.
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Build wheel and sdist with hatch
        run: uvx hatch build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    env:
      TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Validate package metadata
        run: uvx twine check dist/*
      - name: Publish to TestPyPI
        if: env.TEST_PYPI_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.TEST_PYPI_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
      - name: Skip publish when token is unavailable
        if: env.TEST_PYPI_TOKEN == ''
        run: |
          echo "TEST_PYPI_API_TOKEN is not available for this run."
          echo "Distribution artifacts were built and validated, but upload was skipped."

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
