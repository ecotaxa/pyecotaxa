[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pyecotaxa"
description = "Query EcoTaxa and process its output"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GNU General Public License v3 (GPLv3)" }
authors = [{ name = "Simon-Martin Schroeder", email = "sms@informatik.uni-kiel.de" }]
dynamic = ["version"]
dependencies = [
	"pandas>=1.2",
	"numpy",
	"python-dotenv",
	"requests",
	"tqdm",
	"werkzeug",
	"semantic_version",
	"atomicwrites",
	"click",
	"anytree",
	"python-dateutil",
	"requests_toolbelt",
]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
	"Operating System :: OS Independent",
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
]

[project.optional-dependencies]
tests = [
	"pytest",
	"pytest-cov",
	"ruff",
]
docs = [
	"sphinx >= 1.4",
	"sphinx_rtd_theme",
	"sphinx-autodoc-typehints>=1.10.0",
]
dev = [
	"black",
	"hatch",
]

[project.scripts]
pyecotaxa = "pyecotaxa.cli:cli"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyecotaxa"]

[tool.black]
exclude = "\\.eggs|\\.git|\\.hg|\\.mypy_cache|\\.nox|\\.tox|\\.venv|_build|buck-out|build|dist|versioneer\\.py|_version\\.py|\\.vscode"
line-length = 88

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
line_length = 88

